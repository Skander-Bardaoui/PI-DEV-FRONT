# ═══════════════════════════════════════════════════════════════════════════
# SONARQUBE CONFIGURATION - FRONTEND
# ═══════════════════════════════════════════════════════════════════════════

# Project Information
sonar.projectKey=frontend
sonar.projectName=Frontend React - PI DEV
sonar.projectVersion=1.0

# Source Code
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/public/**,**/*.config.*,**/main.tsx,**/*.d.ts

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.config.*,**/main.tsx,**/*.d.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Code Quality
sonar.typescript.node=node

# Duplications
sonar.cpd.exclusions=**/mockData/**,**/*.config.*

# Quality Gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
